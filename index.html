<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 소개 사이트</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111;
      color:white;
    }

    header{
      background:#222;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      color:orange;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    .hero{
      text-align:center;
      padding:100px 20px;
      background:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200') center/cover;
    }

    .hero h2{
      font-size:50px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
    }

    .section{
      padding:60px 20px;
      text-align:center;
    }

    .cards{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin-top:30px;
    }

    .card{
      background:#222;
      padding:20px;
      width:250px;
      border-radius:10px;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    footer{
      background:#222;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }
  </style>
</head>
<body>

<header>
  <h1>CS2 WORLD</h1>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Counter Strike 2</h2>
  <p>세계적으로 인기 있는 FPS 게임</p>
</section>

<section class="section">
  <h2>게임 소개</h2>

  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=800">
      <h3>FPS 게임</h3>
      <p>전략과 팀워크가 중요한 슈팅 게임입니다.</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=800">
      <h3>다양한 맵</h3>
      <p>여러 가지 맵과 전술 플레이가 가능합니다.</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1548686304-89d188a80029?q=80&w=800">
      <h3>멀티 플레이</h3>
      <p>친구들과 함께 경쟁하며 플레이할 수 있습니다.</p>
    </div>

  </div>
</section>

<footer>
  <p>2026 CS2 Website | 제작자 Bilguun</p>
</footer>

</body>
</html>
