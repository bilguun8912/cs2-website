<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CS2 WORLD</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#111;
      color:white;
    }

    header{
      background:#222;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      color:orange;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      transition:0.3s;
    }

    nav a:hover{
      color:orange;
    }

    .hero{
      height:90vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      background:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200') center/cover;
    }

    .hero h2{
      font-size:60px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:22px;
      margin-bottom:30px;
    }

    .btn{
      padding:15px 30px;
      background:orange;
      color:black;
      text-decoration:none;
      border-radius:10px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:white;
    }

    .guide{
      padding:60px 20px;
      text-align:center;
    }

    .guide h2{
      margin-bottom:30px;
      color:orange;
    }

    .steps{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .step{
      background:#222;
      width:250px;
      padding:25px;
      border-radius:15px;
    }

    .step h3{
      margin-bottom:15px;
      color:orange;
    }

    footer{
      background:#222;
      text-align:center;
      padding:20px;
      margin-top:50px;
    }

  </style>
</head>

<body>

<header>

  <h1>CS2 WORLD</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="guide.html">Guide</a>
    <a href="contact.html">Contact</a>
  </nav>

</header>

<section class="hero">

  <h2>Counter Strike 2</h2>

  <p>
    최고의 FPS 게임을 소개합니다
  </p>

  <a href="about.html" class="btn">
    게임 소개 보기
  </a>

</section>

<section class="guide">

  <h2>게임 시작 방법</h2>

  <div class="steps">

    <div class="step">
      <h3>STEP 1</h3>
      <p>Steam 프로그램 설치하기</p>
    </div>

    <div class="step">
      <h3>STEP 2</h3>
      <p>CS2 다운로드하기</p>
    </div>

    <div class="step">
      <h3>STEP 3</h3>
      <p>친구와 함께 플레이하기</p>
    </div>

  </div>

<footer>
  <p>2026 CS2 Website | Bilguun</p>
</footer>
